services:
  app:
    image: php:8.3-fpm
    container_name: dms-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - dms
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: dms-nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - dms
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: dms-mysql
    environment:
      MYSQL_DATABASE: dms
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: dms
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dms
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dms-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - dms
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  queue-worker:
    image: php:8.3-fpm
    container_name: dms-queue-worker
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: php artisan queue:work --tries=3 --timeout=90
    networks:
      - dms
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: php:8.3-fpm
    container_name: dms-scheduler
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    networks:
      - dms
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  dms:
    driver: bridge
